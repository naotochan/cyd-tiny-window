; tiny-window — ESP32-2432S028 / CYD family
; LCD silicon is batch-dependent. Do not pick a profile from USB port count alone.
; Default env is the most-cited dual-USB recipe, not a claim about this board.

[platformio]
; Building without -e compiles every LCD profile.
default_envs =
  cyd_ili9341
  cyd_ili9341_inv
  cyd_ili9342
  cyd_st7789_bgr
  cyd_st7789_rgb
  cyd_st7789_bgr_inv
src_dir = src
include_dir = include

[versions]
; Pinned for reproducible builds (do not float).
platform = espressif32@6.8.1
tft_espi = bodmer/TFT_eSPI@2.5.43

[env]
platform = ${versions.platform}
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions/esp32_4mb.csv
lib_deps =
  ${versions.tft_espi}
  tzapu/WiFiManager@2.0.17
lib_ldf_mode = chain+
build_src_filter = +<*>
build_flags =
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  "-DTFT_RST=-1"
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DUSE_HSPI_PORT=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DCORE_DEBUG_LEVEL=0
  -DFIRMWARE_NAME=\"tiny-window\"
  -DFIRMWARE_VERSION=\"0.1.4\"
  -DDEFAULT_ROTATION=3
  -DPANEL_GAMMA=0.90f

; --- LCD profiles (same pins, different controller / colour wiring) ---

; Classic 1x micro-USB CYD recipe (ILI9341 alternative init).
[env:cyd_ili9341]
extends = env
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER=1
  -DPROFILE_NAME=\"cyd_ili9341\"
  -DPROFILE_DRIVER=\"ILI9341_2\"
  -DPROFILE_COLOR=\"default\"
  -DPROFILE_INVERT=0

; Same ILI9341 init with inversion (some 9341 / washed dual-USB batches).
[env:cyd_ili9341_inv]
extends = env
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER=1
  -DTFT_INVERSION_ON=1
  -DPROFILE_NAME=\"cyd_ili9341_inv\"
  -DPROFILE_DRIVER=\"ILI9341_2\"
  -DPROFILE_COLOR=\"default\"
  -DPROFILE_INVERT=1

; ESPHome ESP32-2432S028-9342 dual-USB batch: ILI9341_2 + invert.
; TFT_eSPI 2.5.43 has no separate ILI9342_DRIVER; this is the Arduino mapping.
[env:cyd_ili9342]
extends = env
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER=1
  -DTFT_RGB_ORDER=0
  -DTFT_INVERSION_ON=1
  -DPROFILE_NAME=\"cyd_ili9342\"
  -DPROFILE_DRIVER=\"ILI9341_2_as_9342\"
  -DPROFILE_COLOR=\"RGB\"
  -DPROFILE_INVERT=1

; Most-cited dual-USB (microUSB+USB-C) recipe: ST7789 + BGR + inversion off.
; Start here on a 2-port board, then try rgb / inv / ili9342 if colours are wrong.
[env:cyd_st7789_bgr]
extends = env
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=1
  -DTFT_INVERSION_OFF=1
  -DPROFILE_NAME=\"cyd_st7789_bgr\"
  -DPROFILE_DRIVER=\"ST7789\"
  -DPROFILE_COLOR=\"BGR\"
  -DPROFILE_INVERT=0

; Dual-USB ST7789 with RGB order (community reports of R/B still swapped after BGR).
[env:cyd_st7789_rgb]
extends = env
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=0
  -DTFT_INVERSION_OFF=1
  -DPROFILE_NAME=\"cyd_st7789_rgb\"
  -DPROFILE_DRIVER=\"ST7789\"
  -DPROFILE_COLOR=\"RGB\"
  -DPROFILE_INVERT=0

; Dual-USB ST7789 with inversion on (some 2USB reports used INVERSION_ON).
[env:cyd_st7789_bgr_inv]
extends = env
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=1
  -DTFT_INVERSION_ON=1
  -DPROFILE_NAME=\"cyd_st7789_bgr_inv\"
  -DPROFILE_DRIVER=\"ST7789\"
  -DPROFILE_COLOR=\"BGR\"
  -DPROFILE_INVERT=1
